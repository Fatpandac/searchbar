name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: cd dist && zip -r ../searchbar-${{ github.ref_name }}.zip .
      - run: gh release create "${{ github.ref_name }}" searchbar-*.zip --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
